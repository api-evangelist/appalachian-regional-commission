source: >-
  https://www.arc.gov/ and its research, data, applicant-resources and grantee-resources sections,
  read on 2026-09-07, plus live calls to both machine-readable surfaces.
description: >-
  ARC publishes no plans, no pricing and no API terms, and there is nothing to buy. Both of its
  machine-readable surfaces are open to anonymous callers at no cost — which is the correct posture
  for a federal-state commission whose statutory job is to publish regional data. This file replaces
  a scaffold written by a 2026-05-04 bulk sweep that had invented Free, Professional and Enterprise
  tiers with request quotas, overage pricing, SLA targets and a dedicated account manager. None of
  that existed.
