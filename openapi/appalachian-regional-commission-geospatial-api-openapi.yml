info:
  title: ARC API (ArcGIS Feature Services) Geospatial API
  version: '12'
  summary: Anonymous query access to the 108 public hosted feature services in the Appalachian Regional Commission's ArcGIS Online organization.
  description: The Appalachian Regional Commission operates an ArcGIS Online organization — portal name "Appalachian Regional Commission", urlKey `ARCgov`, organization id `nkunl3y8FDxPkXDl`, confirmed by https://arcgov.maps.arcgis.com/sharing/rest/portals/self on 2026-09-07 — and publishes 108 hosted feature services from it at https://services.arcgis.com/nkunl3y8FDxPkXDl/arcgis/rest/services.
