servers:
- url: https://services.arcgis.com/nkunl3y8FDxPkXDl/arcgis/rest
  description: ARC hosted feature services (ArcGIS Online)
tags:
- name: Geospatial
paths:
  /services:
    get:
      operationId: listFeatureServices
      summary: GET /services
      description: List every service published by the Appalachian Regional Commission ArcGIS Online organization. Returned 200 with 108 FeatureServer entries on 2026-09-07.
      tags:
      - Geospatial
      parameters:
      - name: f
        in: query
        required: false
        description: 'Response format. `json` is the Esri feature JSON envelope; `geojson` returns RFC 7946 GeoJSON; `pjson` is pretty-printed JSON; `html` is the human-readable services directory. Verified live 2026-09-07: `f=json` and `f=geojson` both return 200.'
        schema:
          type: string
          enum:
          - json
          - geojson
          - pjson
          - html
          - pbf
          default: html
      responses:
        '200':
          description: The services directory. `services[]` carries `name`, `type` and the absolute `url` of each feature service.
          content:
            application/json:
              schema: {}
        default:
          description: 'The ArcGIS REST API answers errors with HTTP 200 and an error envelope in the body — check `error.code`, not the status line. Observed live 2026-09-07: requesting layer 99 of `arc_counties` returned `{"error":{"code":400,"message":"","details":["The requested layer (layerId: 99) was not found."]}}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsriError'
  /services/{serviceName}/FeatureServer:
    get:
      operationId: getFeatureService
      summary: GET /services/{serviceName}/FeatureServer
      description: 'Describe one feature service: `serviceDescription`, `copyrightText`, `capabilities`, `maxRecordCount`, `supportedQueryFormats`, `hasStaticData` and the `layers[]` it contains. Every ARC service observed on 2026-09-07 advertises `capabilities: Query` only — this is a read-only surface.'
      tags:
      - Geospatial
      parameters:
      - name: serviceName
        in: path
        required: true
        description: Name of one of the 108 public hosted feature services in the Appalachian Regional Commission ArcGIS Online organization. See `info.x-arc-services` for the full enumeration read from the services directory on 2026-09-07.
        schema:
          type: string
          examples:
          - arc_counties
          - arc_boundary
          - arc_local_development_districts
          - arc_county_economic_status_fy2027_tiger
          - arc_acs_2023_poverty_rates_tiger
      - name: f
        in: query
        required: false
        description: 'Response format. `json` is the Esri feature JSON envelope; `geojson` returns RFC 7946 GeoJSON; `pjson` is pretty-printed JSON; `html` is the human-readable services directory. Verified live 2026-09-07: `f=json` and `f=geojson` both return 200.'
        schema:
          type: string
          enum:
          - json
          - geojson
          - pjson
          - html
          - pbf
          default: html
      responses:
        '200':
          description: The feature service descriptor.
          content:
            application/json:
              schema: {}
        default:
          description: 'The ArcGIS REST API answers errors with HTTP 200 and an error envelope in the body — check `error.code`, not the status line. Observed live 2026-09-07: requesting layer 99 of `arc_counties` returned `{"error":{"code":400,"message":"","details":["The requested layer (layerId: 99) was not found."]}}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsriError'
  /services/{serviceName}/FeatureServer/{layerId}:
    get:
      operationId: getFeatureLayer
      summary: GET /services/{serviceName}/FeatureServer/{layerId}
      description: 'Describe one feature layer: its `geometryType`, `objectIdField`, the full `fields[]` list with Esri field types, `maxRecordCount`, `supportedQueryFormats` (JSON, geoJSON, PBF) and `advancedQueryCapabilities`. This is the schema document for the layer.'
      tags:
      - Geospatial
      parameters:
      - name: serviceName
        in: path
        required: true
        description: Name of one of the 108 public hosted feature services in the Appalachian Regional Commission ArcGIS Online organization. See `info.x-arc-services` for the full enumeration read from the services directory on 2026-09-07.
        schema:
          type: string
          examples:
          - arc_counties
          - arc_boundary
          - arc_local_development_districts
          - arc_county_economic_status_fy2027_tiger
          - arc_acs_2023_poverty_rates_tiger
      - name: layerId
        in: path
        required: true
        description: Zero-based layer index within the feature service. Every ARC service observed on 2026-09-07 exposes a single layer at index 0.
        schema:
          type: integer
          default: 0
      - name: f
        in: query
        required: false
        description: 'Response format. `json` is the Esri feature JSON envelope; `geojson` returns RFC 7946 GeoJSON; `pjson` is pretty-printed JSON; `html` is the human-readable services directory. Verified live 2026-09-07: `f=json` and `f=geojson` both return 200.'
        schema:
          type: string
          enum:
          - json
          - geojson
          - pjson
          - html
          - pbf
          default: html
      responses:
        '200':
          description: The feature layer descriptor, including the attribute schema.
          content:
            application/json:
              schema: {}
        default:
          description: 'The ArcGIS REST API answers errors with HTTP 200 and an error envelope in the body — check `error.code`, not the status line. Observed live 2026-09-07: requesting layer 99 of `arc_counties` returned `{"error":{"code":400,"message":"","details":["The requested layer (layerId: 99) was not found."]}}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsriError'
  /services/{serviceName}/FeatureServer/{layerId}/query:
    get:
      operationId: queryFeatureLayer
      summary: GET /services/{serviceName}/FeatureServer/{layerId}/query
      description: 'Query features from a layer by attribute (`where`), by geometry, or both — returning Esri feature JSON, GeoJSON or PBF. This is the operation that makes ARC''s regional data callable: county boundaries, the ARC region boundary, local development districts, congressional districts, and the county economic-status, poverty, median-household-income, SNAP, education and population series by fiscal and ACS year.'
      tags:
      - Geospatial
      parameters:
      - name: serviceName
        in: path
        required: true
        description: Name of one of the 108 public hosted feature services in the Appalachian Regional Commission ArcGIS Online organization. See `info.x-arc-services` for the full enumeration read from the services directory on 2026-09-07.
        schema:
          type: string
          examples:
          - arc_counties
          - arc_boundary
          - arc_local_development_districts
          - arc_county_economic_status_fy2027_tiger
          - arc_acs_2023_poverty_rates_tiger
      - name: layerId
        in: path
        required: true
        description: Zero-based layer index within the feature service. Every ARC service observed on 2026-09-07 exposes a single layer at index 0.
        schema:
          type: integer
          default: 0
      - name: where
        in: query
        required: false
        description: SQL-92 WHERE clause applied to the layer's attribute table. Use `1=1` to match every feature.
        schema:
          type: string
          default: 1=1
      - name: objectIds
        in: query
        required: false
        description: Comma-separated list of OBJECTID values to return.
        schema:
          type: string
      - name: geometry
        in: query
        required: false
        description: Geometry used to spatially filter the query, in the format named by `geometryType`.
        schema:
          type: string
      - name: geometryType
        in: query
        required: false
        description: Type of the `geometry` parameter.
        schema:
          type: string
          enum:
          - esriGeometryPoint
          - esriGeometryMultipoint
          - esriGeometryPolyline
          - esriGeometryPolygon
          - esriGeometryEnvelope
          default: esriGeometryEnvelope
      - name: spatialRel
        in: query
        required: false
        description: Spatial relationship applied between the input geometry and the layer's features.
        schema:
          type: string
          enum:
          - esriSpatialRelIntersects
          - esriSpatialRelContains
          - esriSpatialRelWithin
          - esriSpatialRelCrosses
          - esriSpatialRelTouches
          - esriSpatialRelOverlaps
          - esriSpatialRelEnvelopeIntersects
          default: esriSpatialRelIntersects
      - name: inSR
        in: query
        required: false
        description: Spatial reference (WKID) of the input geometry.
        schema:
          type: string
      - name: outSR
        in: query
        required: false
        description: Spatial reference (WKID) requested for the returned geometry.
        schema:
          type: string
      - name: outFields
        in: query
        required: false
        description: Comma-separated attribute fields to return, or `*` for all. `arc_counties` layer 0 exposes OBJECTID, FIPS, STATE, COUNTY, ARC, Shape__Area and Shape__Length.
        schema:
          type: string
          default: '*'
      - name: returnGeometry
        in: query
        required: false
        description: Whether to include feature geometry in the response.
        schema:
          type: boolean
          default: true
      - name: returnCountOnly
        in: query
        required: false
        description: 'Return only the matching feature count. Verified live 2026-09-07: `arc_counties` layer 0 returns `{"count":423}`, the 423 counties of the Appalachian Region.'
        schema:
          type: boolean
          default: false
      - name: returnIdsOnly
        in: query
        required: false
        description: Return only the matching OBJECTID values.
        schema:
          type: boolean
          default: false
      - name: returnDistinctValues
        in: query
        required: false
        description: 'Return distinct values for the requested `outFields`. The layer descriptor reports `supportsDistinct: true`.'
        schema:
          type: boolean
          default: false
      - name: orderByFields
        in: query
        required: false
        description: 'Comma-separated fields to sort by. The layer descriptor reports `supportsOrderBy: true`.'
        schema:
          type: string
      - name: groupByFieldsForStatistics
        in: query
        required: false
        description: Fields to group by when computing `outStatistics`.
        schema:
          type: string
      - name: outStatistics
        in: query
        required: false
        description: 'JSON array of statistic definitions to compute server-side. The layer descriptor reports `supportsStatistics: true`.'
        schema:
          type: string
      - name: resultOffset
        in: query
        required: false
        description: 'Zero-based offset into the result set. Paging is the only way past `maxRecordCount`; the layer descriptor reports `supportsPagination: true`.'
        schema:
          type: integer
      - name: resultRecordCount
        in: query
        required: false
        description: Maximum features to return in this page. Capped by the service's `maxRecordCount`, which is 1000 on every ARC layer observed.
        schema:
          type: integer
          maximum: 1000
      - name: f
        in: query
        required: false
        description: 'Response format. `json` is the Esri feature JSON envelope; `geojson` returns RFC 7946 GeoJSON; `pjson` is pretty-printed JSON; `html` is the human-readable services directory. Verified live 2026-09-07: `f=json` and `f=geojson` both return 200.'
        schema:
          type: string
          enum:
          - json
          - geojson
          - pjson
          - html
          - pbf
          default: html
      responses:
        '200':
          description: Matching features. `f=json` returns the Esri `features[]` envelope; `f=geojson` returns an RFC 7946 FeatureCollection. A `properties.exceededTransferLimit` of true means more features remain — page with `resultOffset`.
          content:
            application/json:
              schema: {}
        default:
          description: 'The ArcGIS REST API answers errors with HTTP 200 and an error envelope in the body — check `error.code`, not the status line. Observed live 2026-09-07: requesting layer 99 of `arc_counties` returned `{"error":{"code":400,"message":"","details":["The requested layer (layerId: 99) was not found."]}}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsriError'
components:
  schemas:
    EsriError:
      type: object
      description: ArcGIS REST error envelope, returned with HTTP 200.
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            details:
              type: array
              items:
                type: string
