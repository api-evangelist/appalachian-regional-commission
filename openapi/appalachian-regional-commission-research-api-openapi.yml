openapi: 3.2.0
info:
  title: ARC and Data API (WordPress REST wp/v2) Research API
  version: wp/v2
  summary: Anonymous read access to ARC research reports and evaluations, regional maps, and applicant/grantee resources.
  description: 'The research surface of www.arc.gov as custom post types on the `wp/v2` namespace: 304 research reports, evaluations, chartbook chapters and fact sheets; 161 map records covering economic status, poverty, median household income, population change, congressional districts and rural-urban county types; and 71 applicant and grantee resources.'
  contact:
    name: Appalachian Regional Commission
    url: https://www.arc.gov/contact-arc/
  license:
    name: U.S. Government Work
    url: https://www.arc.gov/arc-web-and-privacy-policy/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://www.arc.gov/wp-json/
  x-derived-on: '2026-09-07'
  x-provider-published: false
servers:
- url: https://www.arc.gov/wp-json
  description: Production (arc.gov WordPress REST API)
tags:
- name: Research
paths:
  /wp/v2/report:
    get:
      operationId: getReport
      summary: GET /wp/v2/report
      description: List ARC research reports, evaluations, fact sheets and infographics. 304 records live on 2026-09-07.
      tags:
      - Research
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Limit response to posts published after a given ISO8601 compliant date.
      - name: before
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Limit response to posts published before a given ISO8601 compliant date.
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Scope under which the request is made; determines fields present in response.
      - name: exclude
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Ensure result set excludes specific IDs.
      - name: fact_sheets_infographics_topic
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the fact_sheets_infographics_topic taxonomy.
      - name: fact_sheets_infographics_topic_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the fact_sheets_infographics_topic taxonomy.
      - name: fact_sheets_infographics_type
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the fact_sheets_infographics_type taxonomy.
      - name: fact_sheets_infographics_type_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the fact_sheets_infographics_type taxonomy.
      - name: global_type
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the global_type taxonomy.
      - name: global_type_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the global_type taxonomy.
      - name: include
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
        description: Limit result set to specific IDs.
      - name: investment_priority_topic
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the investment_priority_topic taxonomy.
      - name: investment_priority_topic_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the investment_priority_topic taxonomy.
      - name: modified_after
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Limit response to posts modified after a given ISO8601 compliant date.
      - name: modified_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Limit response to posts modified before a given ISO8601 compliant date.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Offset the result set by a specific number of items.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Order sort attribute ascending or descending.
      - name: orderby
        in: query
        required: false
        schema:
          type: string
          enum:
          - author
          - date
          - id
          - include
          - modified
          - parent
          - relevance
          - slug
          - include_slugs
          - title
          default: date
        description: Sort collection by post attribute.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Current page of the collection.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
        description: Maximum number of items to be returned in result set.
      - name: research_eval_maps_data_type
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the research_eval_maps_data_type taxonomy.
      - name: research_eval_maps_data_type_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the research_eval_maps_data_type taxonomy.
      - name: research_report_eval_topic
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the research_report_eval_topic taxonomy.
      - name: research_report_eval_topic_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the research_report_eval_topic taxonomy.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Limit results to those matching a string.
      - name: search_columns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - post_title
            - post_content
            - post_excerpt
          default: []
        description: Array of column names to be searched.
      - name: search_semantics
        in: query
        required: false
        schema:
          type: string
          enum:
          - exact
        description: How to interpret the search input.
      - name: slug
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Limit result set to posts with one or more specific slugs.
      - name: states_counties
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the states_counties taxonomy.
      - name: states_counties_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the states_counties taxonomy.
      - name: status
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - publish
            - future
            - draft
            - pending
            - private
            - trash
            - auto-draft
            - inherit
            - request-pending
            - request-confirmed
            - request-failed
            - request-completed
            - acf-disabled
            - dp-rewrite-republish
            - draft-revision
            - pending-revision
            - future-revision
            - any
          default: publish
        description: Limit result set to posts assigned one or more statuses.
      - name: tax_relation
        in: query
        required: false
        schema:
          type: string
          enum:
          - AND
          - OR
        description: Limit result set based on relationship between multiple taxonomies.
      - name: tax_year
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items with specific terms assigned in the tax_year taxonomy.
      - name: tax_year_exclude
        in: query
        required: false
        schema:
          type: object
        description: Limit result set to items except those with specific terms assigned in the tax_year taxonomy.
      responses:
        '200':
          description: Success. JSON body; collection routes also return `X-WP-Total` and `X-WP-TotalPages` headers.
          headers:
            X-WP-Total:
              description: Total number of records matching the query.
              schema:
                type: integer
            X-WP-TotalPages:
              description: Total number of pages available at the current `per_page`.
              schema:
                type: integer
          content:
            application/json:
              schema: {}
        '400':
          description: Bad request — an invalid parameter was supplied. Body is the WordPress REST error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
        '401':
          description: Unauthorized — the route requires an authenticated WordPress user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
        '403':
          description: Forbidden — the capability is disabled for anonymous callers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
        '404':
          description: Not found — no resource exists with the supplied identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
