specification: API Commons Rate Limits
specificationVersion: '0.1'
provider: Appalachian Regional Commission
providerId: appalachian-regional-commission
generated: '2026-09-07'
method: probed
source: >-
  Response headers captured live from https://www.arc.gov/wp-json/ and
  https://services.arcgis.com/nkunl3y8FDxPkXDl/arcgis/rest/ on 2026-09-07.
description: >-
  ARC publishes no rate limits and returns no rate-limit headers on either machine-readable
  surface. This file replaces a scaffold written by a 2026-05-04 bulk sweep that had invented free,
  professional and enterprise tiers with per-minute and per-month quotas; none of it was real, and
  ARC issues no API keys for any of it to attach to.
limit_count: 0
headers:
  returned: []
  detail: >-
    No X-RateLimit-*, no RateLimit-*, no Retry-After was present on any response observed. The
    WordPress surface returns X-WP-Total, X-WP-TotalPages, Link and cache-control public max-age=86400;
    the ArcGIS surface returns cache-control public max-age=30 with an ETag and Esri trace headers.
responseCodes:
  throttled: unknown
  detail: No 429 was observed and none is documented. Behaviour under load is unknown.
limits: []
practical_ceilings:
  - surface: ARC WordPress REST API
    ceiling: per_page maximum 100
    note: >-
      Not a rate limit, a page-size cap. Reading all 6,293 media records means 63 requests. The
      86,400-second cache-control means a well-behaved client should mostly be served from cache.
  - surface: ARC Geospatial API
    ceiling: maxRecordCount 1000 per query
    note: >-
      Also a page-size cap, enforced per layer. Page with resultOffset/resultRecordCount; watch
      properties.exceededTransferLimit.
    reference: >-
      Capacity here is Esri's, not ARC's — ARC's services run on services.arcgis.com under ArcGIS
      Online's shared limits, which Esri does not publish per-organization.
policies:
  - name: Undocumented
    description: >-
      ARC has published nothing about acceptable use, throttling or quotas for either surface.
      https://www.arc.gov/robots.txt allows all user agents and points at the sitemap; that is the
      only usage signal ARC gives. An honest zero, recorded rather than guessed.
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
