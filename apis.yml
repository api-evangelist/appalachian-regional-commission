description: >-
  The Appalachian Regional Commission (ARC) is a federal-state partnership that invests in
  Appalachia's economic future by funding projects that promote economic development, infrastructure
  improvement, workforce training, and community development across 423 counties in 13 states. ARC
  runs no developer program and publishes no API documentation, but it operates two live,
  anonymous, machine-readable surfaces: the WordPress REST API behind www.arc.gov, which serves its
  research reports, maps, resources, investment priorities, local development districts, events and
  staff as JSON; and 108 public hosted feature services in its own ArcGIS Online organization, which
  carry the region's boundaries and the annual county economic-status, poverty, income, SNAP,
  broadband, education and population series. Neither needs a key.
apis:
  - aid: appalachian-regional-commission:arc-gov-website-wordpress-rest
    name: Appalachian Regional Commission Website (WordPress REST)
    description: 'The public WordPress REST API (wp-json) of the Appalachian Regional Commission website
      at www.arc.gov: the route index of the site''s content management system, catalogued as one site surface
      rather than as separate APIs.'
    baseURL: https://www.arc.gov/wp-json
    tags:
    - WordPress
    x-surface: platform-generated
    properties:
    - type: Documentation
      url: https://www.arc.gov/wp-json
    x-platform: wordpress
    x-platform-surface: rest
  - aid: appalachian-regional-commission:arc-geospatial-api
    name: ARC Geospatial API
    description: >-
      Anonymous query access to the 108 public hosted feature services in the Appalachian Regional
      Commission's own ArcGIS Online organization (org id nkunl3y8FDxPkXDl, portal
      arcgov.maps.arcgis.com). This is where ARC's numbers live in machine-readable form: the ARC
      region boundary, the 423 Appalachian counties keyed on FIPS, the 74 Local Development
      Districts, congressional districts, rural-urban county types, and the annual county
      economic-status designations from FY2014 through FY2027 alongside ACS poverty, median
      household income, SNAP, broadband, education-attainment and population-change series. Returns
      Esri feature JSON, RFC 7946 GeoJSON or PBF.
    humanURL: https://arcgov.maps.arcgis.com/
    baseURL: https://services.arcgis.com/nkunl3y8FDxPkXDl/arcgis/rest
    tags:
      - Geospatial
      - GIS
      - Boundaries
      - Economic Data
      - Open Data
    properties:
      - type: OpenAPI
        url: openapi/appalachian-regional-commission-geospatial-api-openapi.yml
      - type: Overlay
        url: overlays/appalachian-regional-commission-geospatial-overlay.yaml
      - type: APIReference
        url: https://services.arcgis.com/nkunl3y8FDxPkXDl/arcgis/rest/services?f=json
      - type: Portal
        url: https://arcgov.maps.arcgis.com/
      - type: DataModel
        url: data-model/appalachian-regional-commission-data-model.yml
      - type: ErrorCatalog
        url: errors/appalachian-regional-commission-problem-types.yml
      - type: Examples
        url: examples/appalachian-regional-commission-examples.yml
  - aid: appalachian-regional-commission:arc-data-reports
    name: ARC Data Report Tool
    description: >-
      The ARC Data Report Tool provides state- and county-level data for the entire Appalachian
      Region across six topic areas comparing Appalachian data with national averages. Data covers
      economic, demographic, and quality-of-life factors including income, poverty, unemployment,
      education, and health metrics. Reports are available for every Appalachian state and county.
      It is a browser application, not an API: data.arc.gov sits behind a Cloudflare managed
      challenge and returns HTTP 403 to every non-browser client, so no machine-readable surface
      could be reached behind it. The same underlying measures are callable on the ARC Geospatial
      API in this record.
    humanURL: https://data.arc.gov/data
    tags:
      - County Data
      - Demographics
      - Economic Data
      - Open Data
      - Regional Data
    properties:
      - type: Portal
        url: https://data.arc.gov/data
      - type: Documentation
        url: https://www.arc.gov/research-and-data/
