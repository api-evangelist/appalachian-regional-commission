description: >-
  The Appalachian Regional Commission (ARC) is a federal-state partnership that invests in
  Appalachia's economic future by funding projects that promote economic development, infrastructure
  improvement, workforce training, and community development across 423 counties in 13 states. ARC
  runs no developer program and publishes no API documentation, but it operates two live,
  anonymous, machine-readable surfaces: the WordPress REST API behind www.arc.gov, which serves its
  research reports, maps, resources, investment priorities, local development districts, events and
  staff as JSON; and 108 public hosted feature services in its own ArcGIS Online organization, which
  carry the region's boundaries and the annual county economic-status, poverty, income, SNAP,
  broadband, education and population series. Neither needs a key.
apis:
  - aid: appalachian-regional-commission:arc-research-data-api
    name: ARC Research and Data API
    description: >-
      Anonymous read access to the Appalachian Regional Commission's research surface as JSON: 304
      research reports, evaluations, chartbook chapters and fact sheets; 161 map records covering
      economic status, poverty, median household income, population change, congressional districts
      and rural-urban county types; and 71 applicant and grantee resources. Served by the WordPress
      REST API behind www.arc.gov and filterable by ARC's own topic, fiscal-year and
      states-and-counties vocabularies.
    humanURL: https://www.arc.gov/research-and-data/
    baseURL: https://www.arc.gov/wp-json
    tags:
