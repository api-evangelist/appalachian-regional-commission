  - aid: appalachian-regional-commission:arc-taxonomy-api
    name: ARC Taxonomy API
    description: >-
      Anonymous read access to the 34 controlled vocabularies ARC classifies its content with —
      states_counties (446 terms), investment_priority_topic (22), tax_year (70), global_type (31),
      the research, fact-sheet, event, staff and grant-resource vocabularies — plus the
      /wp/v2/types, /wp/v2/taxonomies and /wp/v2/statuses registries that describe the content model
      itself. ARC's content has no foreign keys; these terms are the join.
    humanURL: https://www.arc.gov/research-evaluations-maps-data/
