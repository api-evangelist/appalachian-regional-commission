  - aid: appalachian-regional-commission:arc-geospatial-api
    name: ARC Geospatial API
    description: >-
      Anonymous query access to the 108 public hosted feature services in the Appalachian Regional
      Commission's own ArcGIS Online organization (org id nkunl3y8FDxPkXDl, portal
      arcgov.maps.arcgis.com). This is where ARC's numbers live in machine-readable form: the ARC
      region boundary, the 423 Appalachian counties keyed on FIPS, the 74 Local Development
      Districts, congressional districts, rural-urban county types, and the annual county
      economic-status designations from FY2014 through FY2027 alongside ACS poverty, median
      household income, SNAP, broadband, education-attainment and population-change series. Returns
      Esri feature JSON, RFC 7946 GeoJSON or PBF.
    humanURL: https://arcgov.maps.arcgis.com/
    baseURL: https://services.arcgis.com/nkunl3y8FDxPkXDl/arcgis/rest
