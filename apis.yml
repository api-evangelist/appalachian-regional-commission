  - aid: appalachian-regional-commission:arc-data-reports
    name: ARC Data Report Tool
    description: >-
      The ARC Data Report Tool provides state- and county-level data for the entire Appalachian
      Region across six topic areas comparing Appalachian data with national averages. Data covers
      economic, demographic, and quality-of-life factors including income, poverty, unemployment,
      education, and health metrics. Reports are available for every Appalachian state and county.
      It is a browser application, not an API: data.arc.gov sits behind a Cloudflare managed
      challenge and returns HTTP 403 to every non-browser client, so no machine-readable surface
      could be reached behind it. The same underlying measures are callable on the ARC Geospatial
      API in this record.
    humanURL: https://data.arc.gov/data
    tags:
